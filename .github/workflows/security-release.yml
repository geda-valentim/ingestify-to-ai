name: Release readiness checks
# Manual review gate only. This workflow never publishes or rewrites history.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/install_gitleaks.sh
      - run: python3 .github/scripts/scan_secrets.py --history
  all-python-profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r .github/requirements-security.lock
      - run: python .github/scripts/test_audit_inputs.py
      - run: python .github/scripts/audit_python.py --scope all
