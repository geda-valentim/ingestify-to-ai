# Docker Compose configuration for production
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  minio:
    # Production: use secure credentials from environment
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  api:
    # Production: no volume mounts, use code baked into image
    # Remove dev overrides
    volumes:
      - ./tmp:/tmp/ingestify
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      # Overrides ENVIRONMENT=development from the base file. Without this the
      # global exception handler returns raw exception text to clients.
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production  # generic 500 errors, fail-fast startup checks
    restart: unless-stopped

  worker:
    # Production: use full worker concurrency
    volumes:
      - ./tmp:/tmp/ingestify
      # Keep the shared HF cache so a re-routed vision task never re-downloads
      - hf_cache:/models/huggingface
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    restart: unless-stopped
    # Scale workers in production
    deploy:
      replicas: 5

  worker-vision:
    # Same reason as `beat` below: without this it inherits
    # ENVIRONMENT=development from the base file and bypasses the
    # production-only credential checks in shared/config.py.
    # The ./tmp mount is re-declared because the API hands the decoded image to
    # this worker through it.
    volumes:
      - ./tmp:/tmp/ingestify
      - hf_cache:/models/huggingface
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Concurrency stays at 1 in production too: one resident model per box.
    # Scale out with replicas, never with concurrency.
    deploy:
      replicas: 1

  beat:
    # Celery Beat inherits ENVIRONMENT=development from the base file otherwise,
    # which would bypass the production-only credential checks in shared/config.py
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    # Production: use built image, no dev overrides
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    # Remove dev volumes and command overrides
    volumes: []
    command: []
