# Docker Compose - NVIDIA GPU overlay (OPT-IN)
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   make gpu
#
# Host prerequisites (see docs/GPU.md):
#   - NVIDIA driver installed on the host
#   - nvidia-container-toolkit installed
#   - sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
#
# ---------------------------------------------------------------------------
# Why the GPU declaration lives ONLY here and never in docker-compose.yml
# ---------------------------------------------------------------------------
# (a) On a host without nvidia-container-toolkit, Compose HARD-FAILS at
#     container create with:
#         could not select device driver "nvidia" with capabilities: [[gpu]]
#     That is a start failure, not a graceful degrade. A plain
#     `docker compose up` must work on a laptop with no GPU.
#
# (b) Compose merges `deploy.resources.reservations.devices` by REPLACING the
#     list. A GPU block in the base file could not be switched off by omission
#     in an overlay - there would be no way back to CPU.
# ---------------------------------------------------------------------------

services:
  worker-vision:
    build:
      args:
        # Swaps the CPU torch index for the CUDA one at build time.
        # cu129 (not cu130) keeps torch on the nvidia-*-cu12 wheels that
        # ctranslate2 / faster-whisper links against, while still covering
        # Blackwell. See backend/requirements-cuda.txt.
        REQUIREMENTS_FILE: requirements-vision-cuda.txt
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu129
    environment:
      # Explicit, not `auto`: a GPU that cannot be satisfied must be a hard
      # error here, never a silent downgrade to CPU.
      - DEVICE=cuda
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    build:
      args:
        # Same CUDA dependency set as worker-vision (shared image layers). The
        # cu129 torch brings the cu12 cuBLAS/cuDNN 9 wheels CTranslate2 needs,
        # and shared.device decides `auto` via torch.cuda - so INSTALL_CUDA_LIBS
        # is deliberately NOT set: its unpinned cuDNN could shadow torch's.
        REQUIREMENTS_FILE: requirements-vision-cuda.txt
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu129
    environment:
      # Docling stays on CPU. `replicas x --concurrency` processes each
      # resolving auto -> cuda:0 would each allocate their own CUDA context
      # plus docling layout/table weights: a near-certain OOM on one consumer
      # GPU. See docs/GPU.md.
      - DEVICE=cpu
      # Whisper alone goes to the GPU: a non-empty WHISPER_DEVICE overrides
      # DEVICE for audio. `auto` falls back to CPU if CUDA is not usable
      # (detected once per worker process, and again if the model fails on GPU).
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-}
    # Each worker process loads its own Whisper model into GPU memory:
    # keep replicas x concurrency low to avoid running out of VRAM.
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1 -Q ingestify -n ingestify-worker@%h
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
